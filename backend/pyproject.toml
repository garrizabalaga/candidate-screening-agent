[project]
name = "sazon-screening"
version = "0.1.0"
description = "Agente de screening de repartidores para Grupo Sazón"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.39",
    "python-multipart>=0.0.9",
    "tzdata",  # zonas horarias para zoneinfo (Windows no las trae)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # TestClient de FastAPI
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
